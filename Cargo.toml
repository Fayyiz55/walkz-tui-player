[package]
name = "walkz-tui"
version = "0.3.1"
edition = "2021"
description = "Walkz TUI Player — Aesthetic Rust Terminal Music Player"
default-run = "walkz-tui"

[lib]
name = "walkz_tui"
path = "rust_src/lib.rs"

[[bin]]
name = "walkz-tui"
path = "rust_src/main.rs"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
libc = "0.2"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
id3 = { version = "1.17.2", default-features = false, features = ["decode_picture"] }
walkdir = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
